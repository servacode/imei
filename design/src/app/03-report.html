<!-- meta: {"title":"المواطن: البلاغ وحماية لحظة السرقة","fullPage":true} -->
<div class="board">
  <div class="board-head">
    <div>
      <span class="eyebrow">{{icon siren ic-sm}} التطبيق · البلاغ</span>
      <h1>سُرق جهازك؟ احمِ رقمك ومحافظك أولاً، ثم بلّغ</h1>
      <p class="muted">إجراءات فورية لحظة السرقة، ثم بلاغ قصير يملأ نفسه من «أجهزتي». يصبح البلاغ نافذاً بعد قبول الإدارة أو قوى الأمن، ويدخل الجهاز قائمة المراقبة.</p>
    </div>
    {{logo-plain}}
  </div>
  <div class="phones">

    <figure class="device android">
      <div class="device-body"><div class="device-screen">
        {{> android-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon x}}</span><h2>حماية فورية</h2></div>
        <div class="a-body">
          <div class="a-steps"><span class="on"></span><span></span><span></span><span></span></div>
          <div class="a-card tight" style="background:var(--stolen-bg);border-color:var(--stolen-border)"><b style="font-size:14px">هل كانت شريحة رقمك داخل الجهاز المسروق؟</b><div class="a-row" style="margin-top:8px"><span class="a-btn danger sm">نعم</span><span class="a-btn ghost sm">لا</span></div></div>
          <div class="a-sec">نفعل هذا فوراً</div>
          <div class="a-list">
            <div class="a-item"><span class="a-ic">{{icon message-square-off}}</span><div class="a-txt"><b>إيقاف الرسائل لرقمك المسروق</b><span>لا رموز تحقق تصل للموبايل المسروق</span></div><span class="a-badge success">{{icon lock}} تلقائي</span></div>
            <div class="a-item"><span class="a-ic">{{icon log-out}}</span><div class="a-txt"><b>إنهاء كل الجلسات الأخرى</b><span>يحدث دائماً عند البلاغ</span></div><span class="a-badge success">{{icon lock}} تلقائي</span></div>
            <div class="a-item"><span class="a-ic amber">{{icon phone-off}}</span><div class="a-txt"><b>طلب إيقاف خطي</b><span>سيريتل · منفصل عن حظر الجهاز</span></div><span class="a-toggle on"></span></div>
            <div class="a-item"><span class="a-ic amber">{{icon wallet}}</span><div class="a-txt"><b>تجميد محافظي</b><span>سيريتل كاش، شام كاش</span></div><span class="a-toggle on"></span></div>
          </div>
          <span class="a-btn primary" style="margin-top:auto">متابعة</span>
        </div>
        <div class="gesture"></div>
      </div></div>
      <figcaption><b>لحظة السرقة</b><span>قبل البلاغ · أندرويد</span></figcaption>
    </figure>

    <figure class="device ios">
      <div class="device-body"><div class="device-screen">
        {{> ios-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon arrow-right}}</span><h2>رقم للتواصل</h2></div>
        <div class="a-body">
          <div class="a-steps"><span class="on"></span><span class="on"></span><span></span><span></span></div>
          <p style="font-size:13px;color:var(--text-2)">رقمك المسروق متوقف عن الرسائل. أضف رقماً نوصل إليه أخبار بلاغك.</p>
          <div class="a-field"><span class="a-label">رقم بديل (رقم قريب أو شريحتك الجديدة)</span><div class="a-input focus"><span class="mono-num">0933 418 207</span></div></div>
          <div class="a-field"><span class="a-label">رمز التأكيد المرسل للرقم البديل</span><div class="otp" style="gap:7px"><span class="filled" style="width:38px;height:46px;font-size:20px">4</span><span class="filled" style="width:38px;height:46px;font-size:20px">8</span><span class="filled" style="width:38px;height:46px;font-size:20px">1</span><span style="width:38px;height:46px"></span><span style="width:38px;height:46px"></span><span style="width:38px;height:46px"></span></div></div>
          <div class="a-alert info">{{icon bell-ring}}<div>الرقم البديل <b>للإشعارات فقط</b>. لا يُستخدم أبداً لاستعادة حسابك أو تأكيد أي إجراء حساس.</div></div>
          <div class="a-alert brand">{{icon user-check}}<div>جهاتك الموثوقة (2) تستطيع بدء البلاغ عنك إذا لم تستطع الدخول.</div></div>
          <span class="a-btn primary" style="margin-top:auto">تأكيد ومتابعة</span>
        </div>
        <div class="home-ind"></div>
      </div></div>
      <figcaption><b>الرقم البديل</b><span>للإشعارات فقط · آيفون</span></figcaption>
    </figure>

    <figure class="device android">
      <div class="device-body"><div class="device-screen">
        {{> android-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon arrow-right}}</span><h2>تفاصيل البلاغ</h2></div>
        <div class="a-body">
          <div class="a-steps"><span class="on"></span><span class="on"></span><span class="on"></span><span></span></div>
          <div class="a-card tight a-row"><span class="a-ic">{{icon smartphone}}</span><div class="a-txt"><b class="ltr">Galaxy A34</b><span>من أجهزتي · مسجّل باسمك</span></div><span class="a-badge gray">مسجّل باسمك</span></div>
          <div class="a-seg"><span class="on">سرقة</span><span>فقدان</span></div>
          <div class="a-field"><span class="a-label">متى؟</span><div class="a-input">{{icon calendar}} <span>اليوم · 13:40 تقريباً</span></div></div>
          <div class="a-field"><span class="a-label">أين؟</span><div class="map" style="height:92px;border-radius:13px;border:1px solid var(--border)"><svg class="base" viewBox="0 0 300 92" preserveAspectRatio="xMidYMid slice"><rect width="300" height="92" fill="var(--surface-3)"/><path d="M0 46 H300 M110 0 V92 M220 0 V92" stroke="var(--surface)" stroke-width="9"/><path d="M0 70 C80 60 160 80 300 66" stroke="var(--info-border)" stroke-width="7" fill="none"/></svg><span style="position:absolute;right:46%;top:18px;color:var(--stolen)">{{icon map-pin ic-lg}}</span></div><div class="a-hint">{{icon info}} الحميدية · دمشق — للإدارة والجهات المختصة فقط</div></div>
          <div class="a-field"><span class="a-label">وصف مختصر (اختياري)</span><div class="a-input" style="height:54px"><span class="ph" style="font-size:13px">ماذا حدث؟ لون الغطاء، علامات مميزة…</span></div></div>
          <span class="a-btn primary" style="margin-top:auto">مراجعة وإرسال</span>
        </div>
        <div class="gesture"></div>
      </div></div>
      <figcaption><b>البلاغ</b><span>يمتلئ من «أجهزتي» · أندرويد</span></figcaption>
    </figure>

    <figure class="device ios">
      <div class="device-body"><div class="device-screen" data-tab="reports">
        {{> ios-sb}}
        <div class="a-top"><h2>بلاغي<div class="sub"><span class="mono-num">BL-2026-004377</span></div></h2><span class="a-badge stolen">نافذ</span></div>
        <div class="a-body pad-bottom">
          <div class="a-card">
            <div class="a-timeline">
              <div class="a-tl done"><b>أُرسل البلاغ</b><span>اليوم 14:05</span></div>
              <div class="a-tl done"><b>قُبل البلاغ وأصبح نافذاً</b><span>اليوم 15:20 · بقرار الإدارة</span></div>
              <div class="a-tl done"><b>الجهاز في قائمة المراقبة لدى الشبكات</b><span>تتابعه الجهات المختصة</span></div>
              <div class="a-tl done"><b>أُوقف خطك وجُمّدت محافظك</b><span>بانتظار شام كاش</span></div>
              <div class="a-tl now"><b>المنصة تتابع، وسنبلغك بأي مستجد</b><span>القرار للجهات المختصة</span></div>
            </div>
          </div>
          <div class="a-alert brand">{{icon scan-search}}<div><b>جرى فحص جهازك</b> اليوم 18:12. المنصة تتابع الأمر وستبلغك بأي مستجد.</div></div>
          <div class="a-row"><span class="a-btn ghost sm">{{icon hand-coins}} إعلان مكافأة</span><span class="a-btn ghost sm">طلب إغلاق</span></div>
        </div>
        {{> tab-citizen}}
        <div class="home-ind"></div>
      </div></div>
      <figcaption><b>متابعة البلاغ</b><span>دون أي معلومة عن الفاحص · آيفون</span></figcaption>
    </figure>

  </div>
</div>

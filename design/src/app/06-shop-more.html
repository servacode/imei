<!-- meta: {"title":"المحل: الشراء من شخص والموظفون والأدوات","fullPage":true} -->
<div class="board">
  <div class="board-head">
    <div>
      <span class="eyebrow">{{icon store ic-sm}} التطبيق · المحل</span>
      <h1>الشراء الآمن، والموظفون بصلاحيات يحددها صاحب المحل</h1>
      <p class="muted">قبل شراء أي جهاز مستعمل يُفحص إلزامياً، وتُصوَّر هوية البائع. وإذا كان الجهاز مبلّغاً عنه تظهر رسالة واحدة واضحة: لا تشترِه. والخدمات المدفوعة تظهر في التطبيق بحالتها فقط.</p>
    </div>
    {{logo-plain}}
  </div>
  <div class="phones">

    <figure class="device ios">
      <div class="device-body"><div class="device-screen">
        {{> ios-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon x}}</span><h2>شراء من شخص</h2></div>
        <div class="a-body">
          <div class="a-field"><span class="a-label">رقم IMEI</span><div class="a-input"><span class="mono-num">35 488211 093344 7</span></div></div>
          <div class="a-status stolen" style="flex-direction:column;text-align:center;padding:22px 14px">
            <span class="si" style="width:64px;height:64px">{{icon octagon-x ic-lg}}</span>
            <h3 style="font-size:20px">لا تشترِ هذا الجهاز</h3>
            <p>الجهاز مبلّغ عنه، ولا يمكن تسجيل شرائه.</p>
          </div>
          <div class="a-list">
            <div class="a-item"><span class="a-ic gray">{{icon hand}}</span><div class="a-txt"><b>لا تواجه البائع ولا تحتجزه</b><span>سلامتك وسلامة محلك أولاً</span></div></div>
            <div class="a-item"><span class="a-ic gray">{{icon message-circle-off}}</span><div class="a-txt"><b>اعتذر بهدوء عن الشراء</b><span>دون ذكر السبب</span></div></div>
            <div class="a-item"><span class="a-ic">{{icon shield-check}}</span><div class="a-txt"><b>الباقي على الإدارة وقوى الأمن</b><span>لا مطلوب منك أي شيء آخر</span></div></div>
          </div>
          <span class="a-btn ghost" style="margin-top:auto">إنهاء العملية</span>
        </div>
        <div class="home-ind"></div>
      </div></div>
      <figcaption><b>جهاز مبلّغ عنه</b><span>رسالة المحل · آيفون</span></figcaption>
    </figure>

    <figure class="device android">
      <div class="device-body"><div class="device-screen">
        <div class="a-camera">
          {{> android-sb-dark}}
          <div class="a-top"><span class="a-iconbtn">{{icon arrow-right}}</span><h2>هوية البائع<div class="sub">الوجه الأمامي · 1 من 2</div></h2></div>
          <div class="a-frame" style="width:262px;height:170px;margin-top:34px"><div class="id-art"><span class="ph"></span><div style="margin-right:70px"><div class="ln" style="width:80%"></div><div class="ln"></div><div class="ln" style="width:70%"></div><div class="ln" style="width:45%"></div></div><span class="specimen">SPECIMEN</span></div><i></i><i></i><i></i><i></i></div>
          <p class="a-cam-caption">ضع البطاقة داخل الإطار في مكان مضاء. تُلتقط الصورة بالكاميرا مباشرة، وتُحفظ مشفّرة ولا يراها إلا المشرف.</p>
          <div class="a-cam-bottom"><div class="a-pill-dark">{{icon scan-text}} البطاقة واضحة · الحواف مكتملة</div><span class="a-shutter"></span></div>
        </div>
        <div class="gesture" style="background:#fff;opacity:.6"></div>
      </div></div>
      <figcaption><b>الشراء: صورة هوية البائع</b><span>إلزامية · أندرويد</span></figcaption>
    </figure>

    <figure class="device ios">
      <div class="device-body"><div class="device-screen" data-tab="staff">
        {{> ios-sb}}
        <div class="a-top"><h2>الموظفون</h2><span class="a-iconbtn">{{icon user-plus}}</span></div>
        <div class="a-body pad-bottom">
          <div class="a-list">
            <div class="a-item"><span class="avatar" style="width:36px;height:36px;border-radius:50%;background:var(--brand-500);color:#fff;display:grid;place-items:center;font-weight:700">ع</span><div class="a-txt"><b>علي حسن</b><span>جهاز مربوط · نشط الآن</span></div><span class="a-badge clean">فعّال</span></div>
            <div class="a-item"><span style="width:36px;height:36px;border-radius:50%;background:#2D6CB5;color:#fff;display:grid;place-items:center;font-weight:700">م</span><div class="a-txt"><b>مازن يوسف</b><span>آخر نشاط أمس</span></div><span class="a-badge clean">فعّال</span></div>
          </div>
          <div class="a-sec">صلاحيات علي</div>
          <div class="a-list">
            <div class="a-item"><div class="a-txt"><b>البيع</b></div><span class="a-toggle on"></span></div>
            <div class="a-item"><div class="a-txt"><b>الشراء من أشخاص</b></div><span class="a-toggle on"></span></div>
            <div class="a-item"><div class="a-txt"><b>الصيانة</b></div><span class="a-toggle"></span></div>
            <div class="a-item"><div class="a-txt"><b>عرض كل المعاملات</b><span>وإلا يرى معاملاته فقط</span></div><span class="a-toggle"></span></div>
          </div>
        </div>
        {{> tab-shop}}
        <div class="home-ind"></div>
      </div></div>
      <figcaption><b>الموظفون وصلاحياتهم</b><span>لصاحب المحل فقط · آيفون</span></figcaption>
    </figure>

    <figure class="device android">
      <div class="device-body"><div class="device-screen" data-tab="more">
        {{> android-sb}}
        <div class="a-top"><h2>المزيد</h2></div>
        <div class="a-body pad-bottom">
          <div class="a-sec">أدوات المحل</div>
          <div class="a-list">
            <div class="a-item"><span class="a-ic">{{icon chart-column}}</span><div class="a-txt"><b>تقارير المبيعات المتقدمة</b><span>مفعّلة حتى 30/11/2026</span></div><span class="a-badge clean">مفعّلة</span></div>
            <div class="a-item"><span class="a-ic gray">{{icon boxes}}</span><div class="a-txt"><b>إدارة المخزون</b><span>غير مفعّلة</span></div><span class="a-badge gray">غير مفعّلة</span></div>
          </div>
          <div class="a-sec">خدمات</div>
          <div class="a-list">
            <div class="a-item"><span class="a-ic">{{icon shopping-bag}}</span><div class="a-txt"><b>المتجر</b><span>قطع وإكسسوارات من المورّدين</span></div><span class="a-chev">{{icon chevron-left}}</span></div>
            <div class="a-item"><span class="a-ic blue">{{icon clipboard-check}}</span><div class="a-txt"><b>الالتزام والتقارير</b><span>ما يُرسل لوزارة الداخلية</span></div><span class="a-chev">{{icon chevron-left}}</span></div>
            <div class="a-item"><span class="a-ic gray">{{icon life-buoy}}</span><div class="a-txt"><b>طلبات الدعم</b><span>طلب واحد مفتوح</span></div><span class="a-chev">{{icon chevron-left}}</span></div>
            <div class="a-item"><span class="a-ic gray">{{icon settings}}</span><div class="a-txt"><b>إعدادات المحل</b><span>العنوان والموقع والطابعة</span></div><span class="a-chev">{{icon chevron-left}}</span></div>
          </div>
        </div>
        {{> tab-shop}}
        <div class="gesture"></div>
      </div></div>
      <figcaption><b>الأدوات بحالتها فقط</b><span>دون زر شراء في التطبيق · أندرويد</span></figcaption>
    </figure>

  </div>
</div>

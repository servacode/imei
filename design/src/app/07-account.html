<!-- meta: {"title":"الحساب: الإشعارات والدعم والإعدادات والإكمال من الموقع","fullPage":true} -->
<div class="board">
  <div class="board-head">
    <div>
      <span class="eyebrow">{{icon circle-user-round ic-sm}} التطبيق · الحساب</span>
      <h1>حسابك بين يديك، ومن الموقع إلى التطبيق بمسحة</h1>
      <p class="muted">إشعار واحد لكل عملية، وطلبات دعم برقم مرجعي، وإعدادات الثيم والأمان. وعلى الكمبيوتر، الخطوات التي تحتاج كاميرا أو موقعاً دقيقاً تكتمل بمسح رمز QR بالتطبيق.</p>
    </div>
    {{logo-plain}}
  </div>
  <div class="phones">

    <figure class="device android">
      <div class="device-body"><div class="device-screen" data-tab="home">
        {{> android-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon arrow-right}}</span><h2>الإشعارات</h2><a class="small">تحديد الكل كمقروء</a></div>
        <div class="a-body pad-bottom">
          <div class="a-list">
            <div class="a-item"><span class="a-ic red">{{icon scan-search}}</span><div class="a-txt"><b>جرى فحص جهازك المبلّغ عنه</b><span>المنصة تتابع وستبلغك بأي مستجد · 18:12</span></div></div>
            <div class="a-item"><span class="a-ic">{{icon circle-check}}</span><div class="a-txt"><b>قُبل بلاغك وأصبح نافذاً</b><span>BL-2026-004377 · 15:20</span></div></div>
            <div class="a-item"><span class="a-ic amber">{{icon wallet}}</span><div class="a-txt"><b>جمّدت سيريتل كاش محفظتك</b><span>بانتظار شام كاش · 14:40</span></div></div>
            <div class="a-item"><span class="a-ic blue">{{icon receipt-text}}</span><div class="a-txt"><b>فاتورة جديدة في حسابك</b><span>Galaxy A55 من محل النور · أمس</span></div></div>
            <div class="a-item"><span class="a-ic gray">{{icon user-check}}</span><div class="a-txt"><b>قبلت ريم دعوتك جهةً موثوقة</b><span>قبل يومين</span></div></div>
          </div>
        </div>
        {{> tab-citizen}}
        <div class="gesture"></div>
      </div></div>
      <figcaption><b>الإشعارات</b><span>أندرويد</span></figcaption>
    </figure>

    <figure class="device ios">
      <div class="device-body"><div class="device-screen">
        {{> ios-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon arrow-right}}</span><h2>طلبات الدعم</h2><span class="a-iconbtn">{{icon plus}}</span></div>
        <div class="a-body">
          <div class="a-alert warn">{{icon shield-alert}}<div>فريق الدعم <b>لا يطلب منك كلمة المرور أو رمز التحقق أبداً</b>.</div></div>
          <div class="a-list">
            <div class="a-item"><span class="a-ic blue">{{icon messages-square}}</span><div class="a-txt"><b>لم تصلني فاتورة الشراء</b><span><span class="mono-num">ST-2026-000318</span> · ردّ الدعم قبل ساعة</span></div><span class="a-badge warn">بانتظار ردّك</span></div>
            <div class="a-item"><span class="a-ic gray">{{icon messages-square}}</span><div class="a-txt"><b>تعديل اسمي في الحساب</b><span><span class="mono-num">ST-2026-000201</span></span></div><span class="a-badge clean">محلول</span></div>
          </div>
          <div class="a-sec">طلب جديد</div>
          <div class="a-card tight">
            <div class="a-field"><span class="a-label">التصنيف</span><div class="a-input">الحساب<span class="grow"></span>{{icon chevron-down}}</div></div>
            <div class="a-field" style="margin-top:8px"><span class="a-label">اشرح المشكلة</span><div class="a-input" style="height:58px;align-items:flex-start;padding-top:8px"><span class="ph" style="font-size:13px">ماذا حدث؟</span></div></div>
          </div>
          <span class="a-btn primary" style="margin-top:auto">إرسال الطلب</span>
        </div>
        <div class="home-ind"></div>
      </div></div>
      <figcaption><b>طلبات الدعم</b><span>برقم مرجعي · آيفون</span></figcaption>
    </figure>

    <figure class="device android">
      <div class="device-body"><div class="device-screen" data-tab="account">
        {{> android-sb}}
        <div class="a-top"><h2>حسابي</h2></div>
        <div class="a-body pad-bottom">
          <div class="a-card tight a-row"><span style="width:44px;height:44px;border-radius:50%;background:var(--brand-500);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px">س</span><div class="a-txt"><b>سامر العبدالله</b><span><span class="mono-num">SY-4K7P92</span> · {{icon badge-check ic-sm}} هوية موثّقة</span></div></div>
          <div class="a-sec">المظهر</div>
          <div class="a-seg"><span>فاتح</span><span>غامق</span><span class="on">تلقائي</span></div>
          <div class="a-sec">الأمان</div>
          <div class="a-list">
            <div class="a-item"><span class="a-ic">{{icon user-check}}</span><div class="a-txt"><b>الجهات الموثوقة</b><span>2 من 3</span></div><span class="a-chev">{{icon chevron-left}}</span></div>
            <div class="a-item"><span class="a-ic">{{icon monitor-smartphone}}</span><div class="a-txt"><b>الأجهزة والجلسات</b><span>3 جلسات نشطة</span></div><span class="a-chev">{{icon chevron-left}}</span></div>
            <div class="a-item"><span class="a-ic">{{icon eye}}</span><div class="a-txt"><b>من اطّلع على بياناتي</b><span>آخر اطلاع: محل النور · أمس</span></div><span class="a-chev">{{icon chevron-left}}</span></div>
            <div class="a-item"><span class="a-ic gray">{{icon repeat}}</span><div class="a-txt"><b>التبديل إلى محل النور</b><span>لديك دور صاحب محل</span></div><span class="a-chev">{{icon chevron-left}}</span></div>
          </div>
        </div>
        {{> tab-citizen}}
        <div class="gesture"></div>
      </div></div>
      <figcaption><b>حسابي</b><span>الثيم والأمان والأدوار · أندرويد</span></figcaption>
    </figure>

    <figure class="device ios">
      <div class="device-body"><div class="device-screen">
        <div class="a-camera">
          {{> ios-sb-dark}}
          <div class="a-top"><span class="a-iconbtn">{{icon x}}</span><h2>امسح رمز الموقع</h2></div>
          <div class="a-frame square" style="margin-top:12px"><div style="position:absolute;inset:26px;background:#fff;border-radius:10px;padding:10px">{{qr https://basma.sy/h/7KQ2TF}}</div><i></i><i></i><i></i><i></i></div>
          <p class="a-cam-caption">افتح الخطوة على الموقع وامسح الرمز الظاهر على الشاشة.</p>
        </div>
        <div class="a-sheet">
          <span class="grab"></span>
          <div class="a-row"><span class="a-ic">{{icon monitor-smartphone}}</span><div class="a-txt"><b>إكمال خطوة من الموقع</b><span>تصوير الهوية · للحساب <span class="mono-num">SY-4K7P92</span></span></div></div>
          <div class="a-checks"><div class="a-check">{{icon timer}} صالح لمرة واحدة <span class="v">بقي 8:41</span></div><div class="a-check">{{icon user-check}} الحساب نفسه على الموقع والتطبيق <span class="v" style="color:var(--clean)">✓</span></div></div>
          <span class="a-btn primary">متابعة التصوير</span>
        </div>
        <div class="home-ind" style="z-index:9"></div>
      </div></div>
      <figcaption><b>الإكمال من الموقع</b><span>مسح رمز QR · آيفون</span></figcaption>
    </figure>

  </div>
</div>

<!-- meta: {"title":"المحل: المحفظة وتعبئة الرصيد","fullPage":true} -->
<div class="board">
  <div class="board-head">
    <div>
      <span class="eyebrow">{{icon wallet ic-sm}} التطبيق · محفظة المحل</span>
      <h1>عبّئ رصيد سيريتل وMTN من محفظة محلك مباشرة</h1>
      <p class="muted">محفظة واحدة للمحل يشحنها من شام كاش ويسحب إليها، ويعبّئ منها الرصيد ويدفع طلبات المتجر. المال محفوظ لدى شام كاش باسم المحل، والموظف يعبّئ ضمن حده اليومي ولا يسحب.</p>
    </div>
    {{logo-plain}}
  </div>
  <div class="phones">

    <figure class="device android">
      <div class="device-body"><div class="device-screen" data-tab="more">
        {{> android-sb}}
        <div class="a-top"><h2>محفظة المحل</h2><span class="a-btn ghost sm" style="height:34px;padding:0 10px">{{icon settings}} الإعدادات</span></div>
        <div class="a-body pad-bottom">
          <div class="a-hero" style="padding:16px 16px 14px">
            <span class="ring"></span>
            <p>الرصيد المتاح</p>
            <div style="font-size:28px;font-weight:700;line-height:1.3"><span class="mono-num">1,284,500</span> ل.س</div>
            <p style="margin-top:2px">محفوظ لدى شام كاش · محل النور للموبايل</p>
            <div class="a-row" style="margin-top:12px">
              <span class="a-btn sm" style="background:#fff;color:#13201A;flex:1">{{icon arrow-down-to-line}} شحن</span>
              <span class="a-btn sm" style="background:rgba(255,255,255,.16);color:#fff;flex:1">{{icon arrow-up-from-line}} سحب</span>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div class="a-card tight"><span class="a-ic" style="margin-bottom:6px">{{icon smartphone-charging}}</span><b style="font-size:13.5px">تعبئة رصيد</b><div class="a-note">سيريتل وMTN</div></div>
            <div class="a-card tight"><span class="a-ic blue" style="margin-bottom:6px">{{icon shopping-bag}}</span><b style="font-size:13.5px">دفع طلب متجر</b><div class="a-note">بدل الدفع عند الاستلام</div></div>
          </div>
          <span class="a-btn ghost sm" style="color:var(--danger)">{{icon snowflake}} تجميد المحفظة فوراً</span>
          <div class="a-sec">آخر العمليات <a>الكشف</a></div>
          <div class="a-list">
            <div class="a-item"><span class="a-ic">{{icon smartphone-charging}}</span><div class="a-txt"><b>تعبئة <span class="mono-num">0933••••18</span></b><span>سيريتل · علي · 14:05</span></div><b class="mono-num" style="font-size:13px">−10,000</b></div>
            <div class="a-item"><span class="a-ic blue">{{icon arrow-down-to-line}}</span><div class="a-txt"><b>شحن من شام كاش</b><span>صاحب المحل · 09:12</span></div><b class="mono-num" style="font-size:13px;color:var(--success)">+500,000</b></div>
          </div>
        </div>
        {{> tab-shop}}
        <div class="gesture"></div>
      </div></div>
      <figcaption><b>المحفظة</b><span>صاحب المحل · أندرويد</span></figcaption>
    </figure>

    <figure class="device ios">
      <div class="device-body"><div class="device-screen">
        {{> ios-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon x}}</span><h2>تعبئة رصيد</h2></div>
        <div class="a-body">
          <div class="a-field"><span class="a-label">رقم الزبون</span><div class="a-input focus" style="direction:ltr;font-size:20px;font-weight:700"><span class="mono-num">0944 120 553</span></div></div>
          <div class="a-card tight a-row" style="border-color:var(--warn-border);background:var(--warn-bg)"><span style="width:34px;height:34px;border-radius:10px;background:#FFCC00;color:#1A1A1A;display:grid;place-items:center;font-weight:800;font-size:11px">MTN</span><div class="a-txt"><b>شبكة MTN</b><span>تم التعرّف من بادئة الرقم</span></div></div>
          <div class="a-seg"><span class="on">رصيد</span><span>باقات</span></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
            <span class="a-btn ghost sm">2,000</span><span class="a-btn ghost sm">5,000</span><span class="a-btn sm" style="background:var(--brand-100);color:var(--brand-700);border:1.5px solid var(--primary)">10,000</span>
            <span class="a-btn ghost sm">25,000</span><span class="a-btn ghost sm">50,000</span><span class="a-btn ghost sm">مبلغ آخر</span>
          </div>
          <div class="a-card tight"><dl class="a-kv"><dt>يُخصم من المحفظة</dt><dd class="mono-num">10,000 ل.س</dd><dt>ربح المحل</dt><dd style="color:var(--success)">حسب الاتفاقية</dd><dt>حدك اليومي المتبقي</dt><dd class="mono-num">190,000 ل.س</dd></dl></div>
          <span class="a-btn primary" style="margin-top:auto">{{icon zap}} تعبئة الآن</span>
        </div>
        <div class="a-dim"></div>
        <div class="a-sheet">
          <span class="grab"></span>
          <b style="font-size:16px">تأكيد التعبئة</b>
          <div class="a-alert warn" style="padding:8px 10px">{{icon triangle-alert}}<div>التعبئة لا رجعة فيها بعد التأكيد. تأكد من الرقم مع الزبون.</div></div>
          <div class="center" style="direction:ltr;font-size:30px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1.4">0944 120 553</div>
          <dl class="a-kv"><dt>الشبكة</dt><dd>MTN</dd><dt>القيمة</dt><dd class="mono-num" style="font-size:18px">10,000 ل.س</dd><dt>من المحفظة</dt><dd>محل النور للموبايل</dd></dl>
          <div class="a-row"><span class="a-btn ghost">تعديل الرقم</span><span class="a-btn primary">{{icon check}} تأكيد التعبئة</span></div>
        </div>
        <div class="home-ind" style="z-index:9"></div>
      </div></div>
      <figcaption><b>التعبئة وتأكيدها</b><span>الرقم بخط كبير قبل التنفيذ · الموظف ضمن حده · آيفون</span></figcaption>
    </figure>

    <figure class="device ios">
      <div class="device-body"><div class="device-screen">
        {{> ios-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon x}}</span><h2>تمّت التعبئة</h2></div>
        <div class="a-body">
          <div class="center" style="padding-top:6px">
            <div style="width:68px;height:68px;border-radius:50%;background:var(--success);color:var(--on-solid);display:grid;place-items:center;margin:0 auto 10px">{{icon check ic-xl}}</div>
            <b style="font-size:17px">وصل الرصيد للرقم</b>
            <div class="a-note">إيصال رقم <span class="mono-num">TP-2026-0418827</span></div>
          </div>
          <div class="a-card tight">
            <dl class="a-kv">
              <dt>الرقم</dt><dd class="mono-num">0944••••53</dd>
              <dt>الشبكة</dt><dd>MTN</dd>
              <dt>القيمة</dt><dd class="mono-num">10,000 ل.س</dd>
              <dt>الوقت</dt><dd class="mono-num">14:22</dd>
              <dt>المنفّذ</dt><dd>علي حسن</dd>
            </dl>
          </div>
          <div class="a-alert info">{{icon rotate-ccw}}<div>إذا فشلت أي تعبئة يعود المبلغ للمحفظة تلقائياً، والمعلّقة تُحسم خلال 24 ساعة.</div></div>
          <div class="a-row" style="margin-top:auto"><span class="a-btn ghost">{{icon printer}} طباعة</span><span class="a-btn primary">تعبئة أخرى</span></div>
        </div>
        <div class="home-ind"></div>
      </div></div>
      <figcaption><b>إيصال التعبئة</b><span>آيفون</span></figcaption>
    </figure>

    <figure class="device android">
      <div class="device-body"><div class="device-screen">
        {{> android-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon arrow-right}}</span><h2>سحب إلى شام كاش</h2></div>
        <div class="a-body">
          <div class="a-alert brand">{{icon shield-check}}<div>السحب <b>لصاحب المحل فقط</b>، وإلى محفظة شام كاش باسمه هو.</div></div>
          <div class="a-field"><span class="a-label">المبلغ</span><div class="a-input focus" style="font-size:20px;font-weight:700"><span class="mono-num">750,000</span><span class="grow"></span><span style="font-size:14px;color:var(--text-muted)">ل.س</span></div><div class="a-hint">{{icon info}} المتبقي من حد اليوم: <span class="mono-num">2,000,000</span> ل.س</div></div>
          <div class="a-card tight a-row"><span class="a-ic">{{icon wallet}}</span><div class="a-txt"><b>محفظة شام كاش</b><span>سامر العبدالله · <span class="mono-num">0944••••53</span></span></div><span class="a-badge success">باسمك</span></div>
          <div class="a-field"><span class="a-label">رمز المحفظة</span><div class="otp" style="gap:7px"><span class="filled" style="width:36px;height:44px;font-size:20px">•</span><span class="filled" style="width:36px;height:44px;font-size:20px">•</span><span class="filled" style="width:36px;height:44px;font-size:20px">•</span><span class="filled" style="width:36px;height:44px;font-size:20px">•</span><span style="width:36px;height:44px"></span><span style="width:36px;height:44px"></span></div></div>
          <div class="a-note">بعد الرمز نرسل رمز تحقق إلى واتساب. ولا سحب خلال 72 ساعة من تغيير الرقم أو استعادة الحساب، و24 ساعة من تغيير رمز المحفظة.</div>
          <span class="a-btn primary" style="margin-top:auto">{{icon arrow-up-from-line}} متابعة السحب</span>
        </div>
        <div class="gesture"></div>
      </div></div>
      <figcaption><b>السحب</b><span>صاحب المحل فقط · أندرويد</span></figcaption>
    </figure>

  </div>
</div>

<!-- meta: {"title":"المواطن: نقل الملكية والتسجيل الذاتي","fullPage":true} -->
<div class="board">
  <div class="board-head">
    <div>
      <span class="eyebrow">{{icon arrow-left-right ic-sm}} التطبيق · الملكية</span>
      <h1>بيع آمن بين الأفراد، وتسجيل الأجهزة القديمة</h1>
      <p class="muted">ينقل البائع الملكية برقم المشتري ورقمه الوطني، ويقبلها المشتري من حسابه. والجهاز القديم دون فاتورة يُسجَّل بصورة حيّة للكرتونة وإقرار قانوني ومراجعة الإدارة وفترة انتظار.</p>
    </div>
    {{logo-plain}}
  </div>
  <div class="phones">

    <figure class="device ios">
      <div class="device-body"><div class="device-screen">
        {{> ios-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon arrow-right}}</span><h2>نقل الملكية</h2></div>
        <div class="a-body">
          <div class="a-card tight a-row"><span class="a-ic">{{icon smartphone}}</span><div class="a-txt"><b class="ltr">iPhone 13</b><span class="mono-num">35 671209 884512 6</span></div></div>
          <div class="a-field"><span class="a-label">رقم موبايل المشتري</span><div class="a-input focus"><span class="mono-num">0944 120 553</span></div></div>
          <div class="a-field"><span class="a-label">الرقم الوطني للمشتري</span><div class="a-input"><span class="mono-num">01010 284 391</span></div><div class="a-hint">{{icon shield-check}} يجب أن يطابقا حساب المشتري عند القبول</div></div>
          <div class="a-alert warn">{{icon file-x}}<div>تُلغى شهادة الفحص الحالية عند النقل، ويصدر إيصال نقل للطرفين.</div></div>
          <div class="a-alert brand">{{icon message-circle}}<div>للتأكيد نرسل رمزاً إلى واتساب رقمك المسجّل.</div></div>
          <span class="a-btn primary" style="margin-top:auto">{{icon send}} إرسال طلب النقل</span>
        </div>
        <div class="home-ind"></div>
      </div></div>
      <figcaption><b>البائع ينقل الملكية</b><span>آيفون</span></figcaption>
    </figure>

    <figure class="device android">
      <div class="device-body"><div class="device-screen" data-tab="devices">
        {{> android-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon arrow-right}}</span><h2>طلب نقل إليك</h2></div>
        <div class="a-body pad-bottom">
          <div class="a-card center" style="padding:16px">
            <div class="a-ic" style="width:56px;height:56px;margin:0 auto 8px;border-radius:18px">{{icon arrow-left-right ic-lg}}</div>
            <b style="font-size:16px" class="ltr">Apple iPhone 13</b>
            <div class="a-note">من: سامر ع. · ينتهي خلال 71 ساعة</div>
          </div>
          <div class="a-checks">
            <div class="a-check">{{icon circle-check}} رقم موبايلك مطابق <span class="v" style="color:var(--clean)">✓</span></div>
            <div class="a-check">{{icon circle-check}} رقمك الوطني مطابق <span class="v" style="color:var(--clean)">✓</span></div>
            <div class="a-check">{{icon shield-check}} لا بلاغات على الجهاز <span class="v" style="color:var(--clean)">✓</span></div>
            <div class="a-check">{{icon badge-check}} أصل التسجيل <span class="v">محل</span></div>
          </div>
          <div class="a-note">بعد القبول يصبح الجهاز باسمك فوراً. ولتقديم بلاغ عنه لاحقاً تحتاج توثيق هويتك.</div>
          <div class="a-row"><span class="a-btn ghost">رفض</span><span class="a-btn primary">{{icon check}} قبول الملكية</span></div>
        </div>
        {{> tab-citizen}}
        <div class="gesture"></div>
      </div></div>
      <figcaption><b>المشتري يقبل</b><span>أندرويد</span></figcaption>
    </figure>

    <figure class="device android">
      <div class="device-body"><div class="device-screen">
        <div class="a-camera">
          {{> android-sb-dark}}
          <div class="a-top"><span class="a-iconbtn">{{icon x}}</span><h2>صورة حيّة للكرتونة</h2></div>
          <div class="a-frame tall" style="width:250px;height:250px">
            <div class="box-art"><div class="lbl" style="inset:16px 14px auto;height:auto">Redmi Pad SE<br>IMEI 862417053321908<div class="bars"></div></div>
              <div style="position:absolute;bottom:22px;left:18px;right:60px;background:#FFFDF5;transform:rotate(-5deg);padding:8px 10px;border-radius:3px;color:#13201A;font-weight:700;font-size:18px;direction:ltr;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3)">SY-4K7P92</div>
            </div><i></i><i></i><i></i><i></i>
          </div>
          <p class="a-cam-caption">ضع ورقة مكتوباً عليها رقم حسابك <b class="mono-num">SY-4K7P92</b> بجانب ملصق الكرتونة، وصوّر الآن. لا يُقبل رفع صورة من المعرض.</p>
          <div class="a-cam-bottom"><div class="a-pill-dark">{{icon scan-barcode}} قُرئ الباركود: مطابق للرقم المدخل</div><span class="a-shutter"></span></div>
        </div>
        <div class="gesture" style="background:#fff;opacity:.6"></div>
      </div></div>
      <figcaption><b>التسجيل الذاتي: الصورة الحيّة</b><span>بالكاميرا فقط · أندرويد</span></figcaption>
    </figure>

    <figure class="device ios">
      <div class="device-body"><div class="device-screen">
        {{> ios-sb}}
        <div class="a-top"><span class="a-iconbtn">{{icon arrow-right}}</span><h2>الإقرار والإرسال</h2></div>
        <div class="a-body">
          <div class="a-steps"><span class="on"></span><span class="on"></span><span class="on"></span></div>
          <div class="a-list">
            <div class="a-item"><span class="a-ic">{{icon camera}}</span><div class="a-txt"><b>الصورة الحيّة</b><span>الرقم والباركود مطابقان</span></div><span class="a-badge success">✓</span></div>
            <div class="a-item"><span class="a-ic gray">{{icon paperclip}}</span><div class="a-txt"><b>أدلة إضافية (اختياري)</b><span>صورة قديمة مع الجهاز</span></div><span class="a-badge gray">1</span></div>
          </div>
          <div class="a-card tight" style="border-color:var(--warn-border);background:var(--warn-bg)">
            <div class="a-row" style="align-items:flex-start">{{icon scale}}<div style="font-size:12.5px;line-height:1.7"><b>إقرار قانوني</b><br>تسجيل جهاز ليس ملكك يعرّضك للملاحقة القانونية، وتُحال بياناتك لقوى الأمن.</div></div>
            <div class="check" style="margin-top:8px;font-size:12.5px"><span class="box on">{{icon check ic-sm}}</span>أقرّ بأن الجهاز ملكي</div>
          </div>
          <div class="a-alert info">{{icon hourglass}}<div>تراجع الإدارة الطلب، ثم يبقى الجهاز <b>30 يوماً</b> قيد الانتظار قبل اعتماده، ويظهر أصله «تسجيل ذاتي».</div></div>
          <span class="a-btn primary" style="margin-top:auto">إرسال للمراجعة</span>
        </div>
        <div class="home-ind"></div>
      </div></div>
      <figcaption><b>التسجيل الذاتي: الإقرار</b><span>آيفون</span></figcaption>
    </figure>

  </div>
</div>
